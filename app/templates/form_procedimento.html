<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Sessão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Registrar Atendimento: {{ paciente.nome_completo }}</h4>
                <small>Procedimento: {{ agendamento.tipo_procedimento }}</small>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label>Início da Sessão</label>
                            <input type="datetime-local" name="data_hora_iniciado" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label>Término da Sessão</label>
                            <input type="datetime-local" name="data_hora_finalizacao" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label>Aluno Responsável</label>
                            <input type="text" name="aluno_responsavel" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label>Professor Supervisor</label>
                            <input type="text" name="professor_supervisor" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label>Ações Realizadas (Descrição técnica detalhada)</label>
                        <textarea name="acoes_realizadas" class="form-control" rows="3" placeholder="Ex: Aplicação de toxina botulínica 20 unidades..." required></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label>Foto Antes</label>
                            <input type="file" name="foto_antes" class="form-control" accept="image/*">
                        </div>
                        <div class="col-md-6">
                            <label>Foto Depois</label>
                            <input type="file" name="foto_depois" class="form-control" accept="image/*">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label>Receitas / Recomendações pós-procedimento</label>
                            <textarea name="receitas_recomendadas" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label>Observações da Execução (Intercorrências, etc.)</label>
                            <textarea name="observacoes_execucao" class="form-control" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="text-success fw-bold">Observação Final da Sessão (Evolução geral)</label>
                        <input type="text" name="observacao_final" class="form-control" placeholder="Como o paciente reagiu ao tratamento hoje?">
                    </div>

                    <button type="submit" class="btn btn-primary">Salvar Registro da Sessão</button>
                    <a href="/paciente/{{ paciente.id }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
