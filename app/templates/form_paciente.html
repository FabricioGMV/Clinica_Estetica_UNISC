<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Editar' if paciente else 'Novo' }} Paciente - Estética UNISC</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-white: #ffffff;
            --primary-black: #000000;
            --primary-purple: #CF98FF;
            --text-color: #333333;
            --bg-color: #f4f7f6;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden; /* Evita rolagem horizontal acidental */
        }

        /* --- Menu Lateral (Sidebar) --- */
        .sidebar {
            width: 280px;
            background-color: var(--primary-black);
            color: var(--primary-white);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            transition: var(--transition);
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 1000;
        }

        /* Estado colapsado do menu */
        .sidebar.collapsed {
            width: 85px;
            padding: 25px 15px;
        }

        .sidebar.collapsed .sidebar-header {
            align-items: center;
        }

        .sidebar.collapsed .logo-area span,
        .sidebar.collapsed .sidebar-menu-link span,
        .sidebar.collapsed .sidebar-footer span {
            display: none; /* Esconde os textos */
        }

        .sidebar.collapsed .sidebar-menu-link {
            justify-content: center;
            padding: 14px 0;
        }

        .sidebar.collapsed .sidebar-footer {
            justify-content: center;
            padding: 18px 0;
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 40px;
            transition: var(--transition);
        }

        .sidebar-toggle {
            font-size: 1.6rem;
            color: var(--primary-white);
            cursor: pointer;
            transition: var(--transition);
        }

        .sidebar-toggle:hover {
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-purple);
            margin-top: 25px;
            white-space: nowrap;
        }

        .sidebar-menu {
            list-style: none;
            flex-grow: 1;
            padding-left: 0;
        }

        .sidebar-menu-item {
            margin-bottom: 12px;
        }

        .sidebar-menu-link {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 18px;
            text-decoration: none;
            color: var(--primary-white);
            border-radius: 10px;
            transition: var(--transition);
            font-weight: 500;
            white-space: nowrap;
        }

        .sidebar-menu-link:hover,
        .sidebar-menu-link.active {
            background-color: var(--primary-purple);
            color: var(--primary-black);
        }

        .sidebar-menu-link i {
            font-size: 1.3rem;
            color: var(--primary-purple);
        }
        .sidebar-menu-link:hover i,
        .sidebar-menu-link.active i {
            color: var(--primary-black);
        }

        .sidebar-footer {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }
        .sidebar-footer i {
            color: var(--primary-purple);
            font-size: 1.6rem;
        }

        /* --- Área de Conteúdo Principal --- */
        .content-area {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: var(--transition);
        }

        /* --- Wrapper para centralizar todo o bloco --- */
        .content-wrapper {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto; /* Essa é a mágica para centralizar horizontalmente */
            display: flex;
            flex-direction: column;
        }

        /* --- Botão de Voltar --- */
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: var(--transition);
            margin-bottom: 20px;
            align-self: flex-start;
        }
        
        .btn-voltar i {
            font-size: 1.3rem;
        }

        .btn-voltar:hover {
            color: var(--primary-purple);
        }

        /* --- Título da Página --- */
        .content-header {
            margin-bottom: 30px;
        }

        .content-header h1 {
            font-size: 30px;
            font-weight: bold;
            color: var(--primary-black);
            margin-bottom: 5px;
        }

        .content-header p {
            color: #666;
            font-size: 1rem;
            margin: 0;
        }

        /* --- Formulário Customizado --- */
        .form-wrapper {
            background-color: var(--primary-white);
            border-radius: 15px;
            padding: 35px;
            box-shadow: var(--card-shadow);
            width: 100%; /* Garante que ocupe todo o espaço do wrapper */
        }

        .form-label {
            font-weight: 600;
            color: var(--primary-black);
            margin-bottom: 8px;
        }

        /* Customização dos Inputs Bootstrap */
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 0.25rem rgba(207, 152, 255, 0.25);
        }

        .form-check-input:checked {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        .form-check-label {
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
        }

        /* Customização dos Botões */
        .btn-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn-primary-custom {
            background-color: var(--primary-purple);
            color: var(--primary-black);
            border: none;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .btn-primary-custom:hover {
            background-color: #b87cf0;
            transform: translateY(-2px);
        }

        .btn-secondary-custom {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid #ccc;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-secondary-custom:hover {
            background-color: #f8f9fa;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-list sidebar-toggle" id="sidebarToggle"></i>
            <div class="logo-area">
                <span>Clínica Estética e Spa UNISC</span>
            </div>
        </div>
        
        <ul class="sidebar-menu">
            <li class="sidebar-menu-item">
                <a href="/" class="sidebar-menu-link">
                    <i class="bi bi-grid-1x2"></i>
                    <span>Visão Geral</span>
                </a>
            </li>
            <li class="sidebar-menu-item">
                <a href="/pacientes" class="sidebar-menu-link active">
                    <i class="bi bi-people"></i>
                    <span>Pacientes</span>
                </a>
            </li>
            <li class="sidebar-menu-item">
                <a href="/financeiro" class="sidebar-menu-link">
                    <i class="bi bi-cash-stack"></i>
                    <span>Financeiro</span>
                </a>
            </li>
            <li class="sidebar-menu-item">
                <a href="/estatisticas" class="sidebar-menu-link">
                    <i class="bi bi-graph-up"></i>
                    <span>Estatísticas</span>
                </a>
            </li>
            <li class="sidebar-menu-item">
                <a href="/relatorios" class="sidebar-menu-link">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>Relatórios</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <i class="bi bi-person-circle"></i>
            <span>Admin User</span>
        </div>
    </nav>

    <main class="content-area">
        <div class="content-wrapper">
            
            <a href="{{ '/paciente/' ~ paciente.id if paciente else '/pacientes' }}" class="btn-voltar">
                <i class="bi bi-arrow-left-circle"></i> Voltar
            </a>

            <header class="content-header">
                <h1>{{ 'Editar Paciente' if paciente else 'Cadastrar Novo Paciente' }}</h1>
                <p>Preencha os dados abaixo com atenção.</p>
            </header>

            <div class="form-wrapper">
                <form id="formPaciente" method="POST" action="{{ '/paciente/' ~ paciente.id ~ '/editar' if paciente else '/paciente/novo' }}">
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" name="nome_completo" class="form-control shadow-sm" value="{{ paciente.nome_completo if paciente else '' }}" required>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control shadow-sm" value="{{ paciente.email if paciente else '' }}" required>
                        </div>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Telefone / WhatsApp</label>
                            <input type="text" name="telefone" id="telefone" class="form-control shadow-sm" value="{{ paciente.telefone if paciente else '' }}" required placeholder="+55 11 90000-0000 ou +1 555...">
                        </div>
                        <div class="col-md-4 mt-3 mt-md-0">
                            <label class="form-label">CPF</label>
                            <input type="text" name="cpf" id="cpf" class="form-control shadow-sm" value="{{ paciente.cpf if paciente else '' }}" placeholder="000.000.000-00" required>
                        </div>
                        <div class="col-md-4 mt-3 mt-md-0">
                            <label class="form-label">Data de Nascimento</label>
                            <input type="date" name="data_nascimento" id="data_nascimento" class="form-control shadow-sm" value="{{ paciente.data_nascimento if paciente else '' }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Histórico Médico (Alergias, restrições)</label>
                        <textarea name="historico_medico" class="form-control shadow-sm" rows="3" placeholder="Insira informações relevantes sobre a saúde do paciente...">{{ paciente.historico_medico if paciente else '' }}</textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="termo_consentimento" id="termo" {% if paciente and paciente.termo_consentimento %}checked{% endif %} required>
                        <label class="form-check-label" for="termo">O paciente assinou o Termo de Consentimento Livre e Esclarecido (TCLE)?</label>
                    </div>
                    
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="autorizacao_imagem" id="imagem" {% if paciente and paciente.autorizacao_imagem %}checked{% endif %} required>
                        <label class="form-check-label" for="imagem">O paciente autorizou o Uso de Imagem (Fotos de Antes/Depois)?</label>
                    </div>

                    <div class="btn-actions">
                        <button type="submit" class="btn-primary-custom">
                            <i class="bi bi-check-circle me-1"></i> Salvar Paciente
                        </button>
                        <a href="{{ '/paciente/' ~ paciente.id if paciente else '/pacientes' }}" class="btn-secondary-custom">
                            Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- Script do Menu Lateral (Sidebar Toggle) ---
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                });
            }

            // --- Validações de Máscara (Mantidas como estavam) ---
            const cpfInput = document.getElementById('cpf');
            const telInput = document.getElementById('telefone');
            const dataInput = document.getElementById('data_nascimento'); 
            const form = document.getElementById('formPaciente');

            // --- Máscara CPF (XXX.XXX.XXX-XX) ---
            if (cpfInput) {
                cpfInput.addEventListener('input', function (e) {
                    let v = e.target.value.replace(/\D/g, ''); 
                    if (v.length > 11) v = v.substring(0, 11); 
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                    e.target.value = v;
                });
            }

            // --- Máscara Dinâmica de Telefone ---
            if (telInput) {
                telInput.addEventListener('input', function (e) {
                    let raw = e.target.value;
                    let v = raw.replace(/[^\d+]/g, ''); 
                    
                    if (v.length === 0) {
                        e.target.value = '';
                        return;
                    }

                    if (v[0] !== '+') {
                        v = '+' + v.replace(/\+/g, '');
                    } else {
                        v = '+' + v.substring(1).replace(/\+/g, '');
                    }

                    if (v.startsWith('+55')) {
                        let numerosBr = v.substring(3);
                        if (numerosBr.length > 11) numerosBr = numerosBr.substring(0, 11);
                        
                        let masked = '+55';
                        if (numerosBr.length > 0) {
                            masked += ' ' + numerosBr.substring(0, 2); 
                        }
                        if (numerosBr.length > 2) {
                            if (numerosBr.length <= 10) {
                                masked += ' ' + numerosBr.substring(2, 6);
                                if (numerosBr.length > 6) {
                                    masked += '-' + numerosBr.substring(6, 10);
                                }
                            } else {
                                masked += ' ' + numerosBr.substring(2, 7);
                                masked += '-' + numerosBr.substring(7, 11);
                            }
                        }
                        e.target.value = masked;
                    } 
                    else {
                        if (v.length > 16) v = v.substring(0, 16);
                        e.target.value = v; 
                    }
                });

                if(telInput.value) {
                    telInput.dispatchEvent(new Event('input'));
                }
            }

            // --- Validações de Envio ao Salvar ---
            if (form) {
                form.addEventListener('submit', function(e) {
                    
                    if (dataInput && dataInput.value) {
                        let anoDigitado = parseInt(dataInput.value.split('-')[0]); 
                        let anoAtual = new Date().getFullYear();

                        if (anoDigitado < 1900 || anoDigitado > anoAtual) {
                            e.preventDefault(); 
                            alert(`Erro: O ano de nascimento (${anoDigitado}) é inválido. Insira um ano entre 1900 e ${anoAtual}.`);
                            dataInput.focus();
                            return; 
                        }
                    }

                    if (cpfInput && cpfInput.value) {
                        let cpfNumeros = cpfInput.value.replace(/\D/g, '');
                        if (cpfNumeros.length !== 11) {
                            e.preventDefault(); 
                            alert('Erro: O CPF precisa ter exatamente 11 dígitos.');
                            cpfInput.focus();
                            return; 
                        }
                    }

                    if (telInput && telInput.value) {
                        let textVal = telInput.value;
                        let telNumeros = textVal.replace(/\D/g, '');
                        
                        if (textVal.startsWith('+55')) {
                            if (telNumeros.length < 12 || telNumeros.length > 13) {
                                e.preventDefault();
                                alert('Erro: Para números do Brasil (+55), insira o DDD e o número correto (10 ou 11 dígitos).');
                                telInput.focus();
                                return;
                            }
                        } 
                        else {
                            if (telNumeros.length < 8) {
                                e.preventDefault();
                                alert('Erro: O telefone internacional parece muito curto. Verifique o DDI (ex: +1) e o número.');
                                telInput.focus();
                                return;
                            }
                        }
                    }

                    if (cpfInput && cpfInput.value) {
                        cpfInput.value = cpfInput.value.replace(/\D/g, '');
                    }
                    if (telInput && telInput.value) {
                        telInput.value = telInput.value.replace(/[^\d+]/g, '');
                    }
                });
            }
        });
    </script>
</body>
</html>
