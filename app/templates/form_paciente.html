<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Editar' if paciente else 'Novo' }} Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">{{ 'Editar Paciente' if paciente else 'Cadastrar Novo Paciente' }}</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{{ '/paciente/' ~ paciente.id ~ '/editar' if paciente else '/paciente/novo' }}">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label>Nome Completo</label>
                                    <input type="text" name="nome_completo" class="form-control" value="{{ paciente.nome_completo if paciente else '' }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label>E-mail</label>
                                    <input type="email" name="email" class="form-control" value="{{ paciente.email if paciente else '' }}">
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label>Telefone / WhatsApp</label>
                                    <input type="text" name="telefone" class="form-control" value="{{ paciente.telefone if paciente else '' }}" required>
                                </div>
                                <div class="col-md-4">
                                    <label>CPF</label>
                                    <input type="text" name="cpf" class="form-control" value="{{ paciente.cpf if paciente else '' }}">
                                </div>
                                <div class="col-md-4">
                                    <label>Data de Nascimento</label>
                                    <input type="date" name="data_nascimento" class="form-control" value="{{ paciente.data_nascimento if paciente else '' }}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label>Histórico Médico (Alergias, restrições)</label>
                                <textarea name="historico_medico" class="form-control" rows="3">{{ paciente.historico_medico if paciente else '' }}</textarea>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="termo_consentimento" id="termo" {% if paciente and paciente.termo_consentimento %}checked{% endif %}>
                                <label class="form-check-label" for="termo">Assinou Termo de Consentimento?</label>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" name="autorizacao_imagem" id="imagem" {% if paciente and paciente.autorizacao_imagem %}checked{% endif %}>
                                <label class="form-check-label" for="imagem">Autorizou Uso de Imagem?</label>
                            </div>

                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a href="{{ '/paciente/' ~ paciente.id if paciente else '/pacientes' }}" class="btn btn-secondary">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
