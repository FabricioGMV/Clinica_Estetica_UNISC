<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Editar' if agendamento else 'Novo' }} Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">{{ 'Editar Agendamento' if agendamento else 'Agendar Consulta' }}: {{ paciente.nome_completo }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label>Data e Hora</label>
                            <input type="datetime-local" name="data_hora" class="form-control" value="{{ agendamento.data_hora if agendamento else '' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label>Status</label>
                            <select name="status" class="form-control" id="status_select">
                                <option value="Aguardando" {% if agendamento and agendamento.status == 'Aguardando' %}selected{% endif %}>Aguardando</option>
                                <option value="Confirmado" {% if agendamento and agendamento.status == 'Confirmado' %}selected{% endif %}>Confirmado</option>
                                <option value="Cancelado" {% if agendamento and agendamento.status == 'Cancelado' %}selected{% endif %}>Cancelado</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label>Procedimento</label>
                            <select name="tipo_procedimento" class="form-control" required>
                                <option value="Limpeza de Pele" {% if agendamento and agendamento.tipo_procedimento == 'Limpeza de Pele' %}selected{% endif %}>Limpeza de Pele</option>
                                <option value="Botox" {% if agendamento and agendamento.tipo_procedimento == 'Botox' %}selected{% endif %}>Botox</option>
                                <option value="Peeling" {% if agendamento and agendamento.tipo_procedimento == 'Peeling' %}selected{% endif %}>Peeling</option>
                                <option value="Drenagem Linfática" {% if agendamento and agendamento.tipo_procedimento == 'Drenagem Linfática' %}selected{% endif %}>Drenagem Linfática</option>
                                <option value="Outro" {% if agendamento and agendamento.tipo_procedimento == 'Outro' %}selected{% endif %}>Outro</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label>Sessões Previstas</label>
                            <input type="number" name="sessoes_previstas" class="form-control" value="{{ agendamento.sessoes_previstas if agendamento else '1' }}" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <label>Valor Total (R$)</label>
                            <input type="number" step="0.01" name="valor_cobrado" class="form-control" value="{{ agendamento.valor_cobrado if agendamento else '' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label>Forma de Pagamento</label>
                            <select name="forma_pagamento" class="form-control">
                                <option value="Pix" {% if agendamento and agendamento.forma_pagamento == 'Pix' %}selected{% endif %}>Pix</option>
                                <option value="Cartão de Crédito" {% if agendamento and agendamento.forma_pagamento == 'Cartão de Crédito' %}selected{% endif %}>Cartão de Crédito</option>
                                <option value="Cartão de Débito" {% if agendamento and agendamento.forma_pagamento == 'Cartão de Débito' %}selected{% endif %}>Cartão de Débito</option>
                                <option value="Dinheiro" {% if agendamento and agendamento.forma_pagamento == 'Dinheiro' %}selected{% endif %}>Dinheiro</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label>Observações do Agendamento</label>
                        <textarea name="observacoes" class="form-control" rows="2">{{ agendamento.observacoes if agendamento else '' }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-success">Salvar</button>
                    <a href="/paciente/{{ paciente.id }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>

            <div class="modal fade" id="modalConfirmarCancelamento" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-danger">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title">Atenção!</h5>
                            <button type="button" class="btn-close btn-close-white" onclick="reverterSelecao()" aria-label="Close"></button>
                        </div>
                        <div class="modal-body" id="textoModalCancelamento">
                            </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" onclick="reverterSelecao()">Cancelar</button>
                            <button type="button" class="btn btn-danger" onclick="confirmarCancelamentoModal()">Continuar</button>
                        </div>
                    </div>
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
            
            <script>
                document.addEventListener("DOMContentLoaded", function() {
                    const formAgendamento = document.querySelector('form');
                    const selectStatus = document.getElementById('status_select');
                    const qtdSessoes = Number("{{ qtd_sessoes | default(0) }}");

                    const statusOriginal = (selectStatus.value && selectStatus.value !== 'Cancelado') ? selectStatus.value : 'Confirmado';
                    
                    // 1. Trava para controlar se a pessoa já clicou em "Continuar" no modal
                    let cancelamentoConfirmado = false;

                    // 2. Inicia o Modal uma única vez
                    const modalEl = document.getElementById('modalConfirmarCancelamento');
                    const modalConfirmacao = bootstrap.Modal.getOrCreateInstance(modalEl, {
                        backdrop: 'static',
                        keyboard: false
                    });

                    formAgendamento.addEventListener('submit', function(event) {
                        // Verifica se é 'Cancelado' e se a pessoa ainda não apertou continuar no modal
                        if (selectStatus.value === 'Cancelado' && !cancelamentoConfirmado) {
                            event.preventDefault(); // Impede o formulário de salvar imediatamente

                            // Define o texto correto do modal
                            let textoModal = '';
                            if (qtdSessoes > 0) {
                                textoModal = "Há uma ou mais sessões realizada(s), deseja cancelar este procedimento? Caso confirmado, o procedimento será finalizado automaticamente e não será mais possível alterar o status e nem realizar mais sessões.";
                            } else {
                                textoModal = "Tem certeza que deseja cancelar este agendamento? Uma vez cancelado não será mais possível alterar o status deste procedimento e realizar procedimentos.";
                            }
                            
                            document.getElementById('textoModalCancelamento').innerText = textoModal;

                            modalConfirmacao.show();
                        }
                    });

                    window.reverterSelecao = function() {
                        modalConfirmacao.hide();
                        selectStatus.value = statusOriginal;
                    };

                    window.confirmarCancelamentoModal = function() {
                        cancelamentoConfirmado = true;
                        modalConfirmacao.hide();
                        
                        setTimeout(() => {
                            formAgendamento.submit(); 
                        }, 150);
                    };
                });
            </script>
        </div>
    </div>
</body>
</html>
